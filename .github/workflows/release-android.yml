name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/ilunyu-signing"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ilunyu-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/ilunyu-signing/release.jks"

      - name: Build signed release APK
        env:
          ILUNYU_KEYSTORE_PATH: ${{ runner.temp }}/ilunyu-signing/release.jks
          ILUNYU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ILUNYU_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ILUNYU_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Prepare and verify release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ilunyu-android-${GITHUB_REF_NAME}.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "dist/ilunyu-android-${GITHUB_REF_NAME}.apk"
          sha256sum "dist/ilunyu-android-${GITHUB_REF_NAME}.apk" > "dist/ilunyu-android-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="iLunyu Android ${GITHUB_REF_NAME}"
          notes="Android 正式版本 ${GITHUB_REF_NAME}。APK 已使用项目发布密钥签名；SHA-256 文件随 Release 提供。"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes "$notes" --draft=false --prerelease=false
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$title" --notes "$notes" --verify-tag
          fi
